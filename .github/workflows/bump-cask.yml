name: Bump oss-ai-client cask

# The desktop app ships its own updater, so this cask only has to point at the
# newest release. Running here rather than in the app repo means no cross-repo
# token: this workflow reads that repo's public releases and commits to its own.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the newest desktop release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest release whose tag is a desktop one, so a future non-desktop
          # release in that repo cannot drag the cask backwards.
          tag=$(gh api 'repos/JeffreyJYZ/ai-client-oss/releases?per_page=30' \
            -q '[.[] | select(.draft | not) | select(.prerelease | not) | .tag_name | select(startswith("desktop-v"))][0]')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "no desktop release found"; exit 1
          fi
          version="${tag#desktop-v}"
          url="https://github.com/JeffreyJYZ/ai-client-oss/releases/download/${tag}/oss-ai-client_${version}_universal.dmg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "resolved $tag"

      - name: Read the version the cask pins
        id: cur
        run: |
          set -euo pipefail
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/oss-ai-client.rb | head -1)
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "cask pins $current"

      - name: Fetch the artifact, digest it, rewrite the pin
        if: steps.cur.outputs.version != steps.rel.outputs.version
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          URL: ${{ steps.rel.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/app.dmg "$URL"
          digest=$(sha256sum /tmp/app.dmg | cut -d' ' -f1)
          sed -i "s|^  version \".*\"$|  version \"$VERSION\"|" Casks/oss-ai-client.rb
          sed -i "s|^  sha256 \".*\"$|  sha256 \"$digest\"|" Casks/oss-ai-client.rb
          ruby -c Casks/oss-ai-client.rb
          git diff -- Casks/oss-ai-client.rb

      - name: Commit and push
        if: steps.cur.outputs.version != steps.rel.outputs.version
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "oss-ai-client $VERSION"
          git push
